<!DOCTYPE html>
<html>
<head>
    <title>My Skills</title>
</head>
<body>
    <h1>My Skills</h1>
    <ul>

        {%for skill in skills%}
            <li> {{skill.name}} - {{skill.evidence}} - <a href="{%url 'edit_skill' skill.id %}"> edit</a> </li>
            <form method="POST" action="{% url 'delete_skill' skill.id %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" onclick="return confirm('Are you sure you want to delete this skill?')">Delete</button>
            </form>
        {%endfor%}

    </ul>
</body>
</html>
